<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 万能网课助手</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --purple: #a371f7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 24px;
}
.container { max-width: 900px; margin: 0 auto; }

/* Header */
.header {
  text-align: center; padding: 32px 0 24px;
}
.header h1 { font-size: 28px; font-weight: 700; }
.header p { color: var(--muted); margin-top: 6px; font-size: 14px; }

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px; margin-bottom: 20px;
}
.card-title {
  font-size: 15px; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

/* Buttons */
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 160px;
  padding: 14px 20px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all .2s; text-align: center;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-zhihuishu { background: var(--accent); color: #fff; }
.btn-english { background: var(--purple); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--border); }
.btn-small { padding: 8px 16px; font-size: 13px; min-width: auto; flex: 0; }
.btn-green { background: var(--green); color: #000; }
.btn-red { background: var(--red); color: #fff; }

/* Status */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  font-weight: 600;
}
.status-idle { background: #1a2332; color: var(--muted); }
.status-running { background: #1a2e1a; color: var(--green); }
.status-error { background: #2e1a1a; color: var(--red); }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-idle { background: var(--muted); }
.dot-running { background: var(--green); animation: pulse 1s infinite; }
.dot-error { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Prompt area */
#promptArea {
  display: none; margin-bottom: 20px;
  background: #1a1f2e; border: 1px solid var(--yellow); border-radius: 12px;
  padding: 16px 20px;
}
#promptText { font-size: 14px; margin-bottom: 12px; color: var(--yellow); }
#promptInput { display: flex; gap: 8px; }
#promptInput input {
  flex: 1; padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font-size: 14px;
}

/* Config */
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width:600px) { .config-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.field input {
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 13px;
}
.field input:focus { border-color: var(--accent); outline: none; }
.field input[type="password"] { -webkit-text-security: disc; }

.detail-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.collapsible summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }

/* Log viewer */
#logViewer {
  background: #0a0e13; border: 1px solid var(--border); border-radius: 10px;
  height: 340px; overflow-y: auto; padding: 14px;
  font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
  font-size: 12px; line-height: 1.7;
}
#logViewer .line { white-space: pre-wrap; word-break: break-all; }
#logViewer .line-error { color: var(--red); }
#logViewer .line-prompt { color: var(--yellow); font-weight: 600; }
#logViewer .line-system { color: var(--muted); }
#logViewer .line-status { color: var(--green); }

.log-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

/* Utility */
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.text-muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🎓 万能网课助手</h1>
    <p>智慧树 &middot; WeLearn &middot; U校园 &middot; AI 驱动</p>
  </div>

  <!-- Prompt Area -->
  <div id="promptArea">
    <div id="promptText">⚠️ 模块需要你的输入</div>
    <div id="promptInput">
      <input type="text" id="promptField" placeholder="在此输入..." onkeydown="if(event.key==='Enter')sendResponse()">
      <button class="btn btn-small btn-green" onclick="sendResponse()">发送</button>
    </div>
  </div>

  <!-- Status + Actions -->
  <div class="card">
    <div class="card-title">
      🎮 控制面板
      <span id="statusBadge" class="status status-idle"><span class="dot dot-idle"></span>就绪</span>
    </div>
    <div class="btn-row">
      <button id="btnZhihuishu" class="btn btn-zhihuishu" onclick="startModule('zhihuishu')">
        📺 智慧树<br><small style="opacity:.7">自动视频 + AI答题</small>
      </button>
      <button id="btnEnglish" class="btn btn-english" onclick="startModule('english')">
        📝 WeLearn / U校园<br><small style="opacity:.7">AI 全自动做题</small>
      </button>
    </div>
    <div class="text-muted mt-12">
      ⚠️ 运行中请勿关闭此页面。浏览器窗口会自动弹出，请勿遮挡。
    </div>
  </div>

  <!-- Config -->
  <div class="card">
    <details class="collapsible">
      <summary class="card-title" style="display:inline-flex">⚙️ 配置中心（点击展开）</summary>
      <div class="config-grid mt-16">
        <div class="field"><label>AI API Key</label><input type="password" id="cfg_AI_API_KEY" placeholder="sk-..."></div>
        <div class="field"><label>AI API URL</label><input id="cfg_AI_API_URL" placeholder="https://api.deepseek.com/v1/chat/completions"></div>
        <div class="field"><label>AI Model</label><input id="cfg_AI_MODEL" placeholder="deepseek-chat"></div>
        <div class="field"><label>课程URL（可选）</label><input id="cfg_COURSE_URL" placeholder="https://studyh5.zhihuishu.com/..."></div>
        <div class="field"><label>智慧树账号</label><input id="cfg_COURSE_USERNAME" placeholder="手机号"></div>
        <div class="field"><label>智慧树密码</label><input type="password" id="cfg_COURSE_PASSWORD" placeholder="密码"></div>
      </div>
      <div class="detail-row mt-16">
        <span class="text-muted">配置保存在本地 .env 文件，不会上传到服务器</span>
        <button class="btn btn-small btn-outline" onclick="saveConfig()">💾 保存配置</button>
      </div>
    </details>
  </div>

  <!-- Logs -->
  <div class="card">
    <div class="log-bar">
      <div class="card-title" style="margin:0">📋 运行日志</div>
      <button class="btn btn-small btn-outline" onclick="clearLogs()">清空</button>
    </div>
    <div id="logViewer"></div>
  </div>

</div>

<script>
const logViewer = document.getElementById('logViewer');
const statusBadge = document.getElementById('statusBadge');
const promptArea = document.getElementById('promptArea');
const promptText = document.getElementById('promptText');
let currentPromptId = null;

// ==== SSE Log Stream ====
const es = new EventSource('/api/logs');

es.onmessage = (e) => {
  const { type, message, time } = JSON.parse(e.data);
  appendLog(type, `[${time}] ${message}`);
};

es.addEventListener('prompt', (e) => {
  const { id, question } = JSON.parse(e.data);
  currentPromptId = id;
  promptText.textContent = question;
  promptArea.style.display = 'block';
  document.getElementById('promptField').value = '';
  document.getElementById('promptField').focus();
});

function appendLog(type, text) {
  const div = document.createElement('div');
  div.className = `line line-${type}`;
  div.textContent = text;
  logViewer.appendChild(div);
  logViewer.scrollTop = logViewer.scrollHeight;
}

function clearLogs() {
  logViewer.innerHTML = '';
  appendLog('system', '日志已清空');
}

// ==== Prompt Response ====
function sendResponse() {
  const answer = document.getElementById('promptField').value;
  if (!answer && answer !== '0') return;
  fetch('/api/respond', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: currentPromptId, answer }),
  }).then(r => r.json()).then(data => {
    if (data.ok) {
      appendLog('system', `> ${answer}`);
      promptArea.style.display = 'none';
      currentPromptId = null;
    }
  });
}

// ==== Module Control ====
async function startModule(name) {
  const btn = name === 'zhihuishu' ? document.getElementById('btnZhihuishu') : document.getElementById('btnEnglish');
  btn.disabled = true;
  setStatus('running', '运行中');

  try {
    await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ module: name }),
    });
  } catch (err) {
    appendLog('error', `请求失败: ${err.message}`);
  }
  // Poll status until done
  pollStatus(btn);
}

async function pollStatus(btn) {
  try {
    const r = await fetch('/api/status');
    const { running } = await r.json();
    if (running) {
      setTimeout(() => pollStatus(btn), 2000);
    } else {
      btn.disabled = false;
      setStatus('idle', '就绪');
    }
  } catch {
    setTimeout(() => pollStatus(btn), 2000);
  }
}

function setStatus(state, text) {
  statusBadge.className = `status status-${state}`;
  statusBadge.innerHTML = `<span class="dot dot-${state}"></span>${text}`;
}

// ==== Config ====
async function loadConfig() {
  const r = await fetch('/api/config');
  const cfg = await r.json();
  const fields = ['AI_API_KEY','AI_API_URL','AI_MODEL','COURSE_URL','COURSE_USERNAME','COURSE_PASSWORD'];
  for (const f of fields) {
    const el = document.getElementById('cfg_' + f);
    if (el && cfg[f] && !cfg[f].includes('your_') && !cfg[f].includes('xxx')) {
      el.value = cfg[f];
    }
  }
}

async function saveConfig() {
  const fields = ['AI_API_KEY','AI_API_URL','AI_MODEL','COURSE_URL','COURSE_USERNAME','COURSE_PASSWORD'];
  const config = {};
  for (const f of fields) {
    config[f] = document.getElementById('cfg_' + f).value;
  }
  await fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(config),
  });
  appendLog('system', '✅ 配置已保存到 .env');
}

loadConfig();
</script>
</body>
</html>
